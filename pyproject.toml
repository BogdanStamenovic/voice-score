[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-score"
version = "0.1.0"
description = "Analyze a singing recording: f0 contour, cents error against target notes, stability, sustain, range and vibrato, over a local HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["singing", "pitch", "f0", "swiftf0", "vocal", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "swift-f0[audio]>=0.3,<0.4",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Benchmark candidates. Heavy (torch); never part of the default install.
pyin = ["librosa>=0.10"]
fcpe = ["torchfcpe>=0.0.4"]
pesto = ["pesto-pitch>=1.0"]
bench = ["librosa>=0.10", "torchfcpe>=0.0.4", "pesto-pitch>=1.0", "huggingface-hub>=0.23"]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "httpx>=0.27",
]

[project.scripts]
voice-score = "voice_score.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_score"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.ruff.lint]
# RUF046: round() on numpy scalars does not return a Python int, the int() is needed.
# B008: File(...)/Form(...) defaults are FastAPI's documented idiom.
# BLE001: soundfile raises assorted exception types for undecodable input; we fall back to ffmpeg.
ignore = ["RUF046", "B008", "BLE001"]
